# Run the platform on a laptop or the office server:  docker compose up
# Then open http://localhost:8000 and sign in as ashley / devpass123 (sample data).
# Data lives in the two named volumes and survives restarts; `docker compose down -v` wipes it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${RMS_DB_ADMIN_PASSWORD:-change-me-admin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    ports:
      - "${RMS_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # database: admin login for setup, the runtime role for the app
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${RMS_DB_NAME:-rms}
      RMS_DB_ADMIN_USER: postgres
      RMS_DB_ADMIN_PASSWORD: ${RMS_DB_ADMIN_PASSWORD:-change-me-admin}
      PGUSER: po_api
      PGPASSWORD: ${RMS_DB_APP_PASSWORD:-change-me-app}
      # app
      PO_PROFILE: sovereign
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-long-random-string}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-0}   # 0 while served over plain http on a laptop
      RMS_DOCUMENT_ROOT: /data/documents
      # first look: sample data and dev logins, second factor off. Set both the other way for the office.
      RMS_SEED_DEMO: ${RMS_SEED_DEMO:-1}
      RMS_REQUIRE_2FA: ${RMS_REQUIRE_2FA:-0}
    volumes:
      - documents:/data/documents

volumes:
  pgdata:
  documents:
