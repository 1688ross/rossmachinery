<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Navy" subtitle="Primary. Core navy #003363 from the logo wedge." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); }
  .row { display: flex; }
  .sw { flex: 1; height: 150px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; box-sizing: border-box; }
  .sw .name { font-weight: 700; font-size: 13px; }
  .sw .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.8; }
  .light { color: #fff; }
  .dark { color: var(--rms-navy); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw light" style="background:var(--rms-navy-950)"><span class="name">navy-950</span><span class="hex">#001A33</span></div>
    <div class="sw light" style="background:var(--rms-navy-900)"><span class="name">navy-900</span><span class="hex">#002647</span></div>
    <div class="sw light" style="background:var(--rms-navy)"><span class="name">navy ●</span><span class="hex">#003363</span></div>
    <div class="sw light" style="background:var(--rms-navy-700)"><span class="name">navy-700</span><span class="hex">#0A447C</span></div>
    <div class="sw light" style="background:var(--rms-navy-600)"><span class="name">navy-600</span><span class="hex">#14528F</span></div>
  </div>
</body>
</html>
