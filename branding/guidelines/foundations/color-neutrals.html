<!-- @dsCard group="Colors" viewport="700x170" name="Neutrals — Steel" subtitle="Cool-tinted grays for surfaces, text and borders." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); }
  .row { display: flex; }
  .sw { flex: 1; height: 170px; display: flex; flex-direction: column; justify-content: flex-end; padding: 9px 8px; box-sizing: border-box; }
  .sw .name { font-weight: 700; font-size: 11px; }
  .sw .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.85; }
  .light { color: #fff; }
  .dark { color: var(--steel-700); }
  .b { box-shadow: inset 0 0 0 1px var(--border-subtle); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw light" style="background:var(--steel-950)"><span class="name">950</span><span class="hex">#0F141B</span></div>
    <div class="sw light" style="background:var(--steel-900)"><span class="name">900</span><span class="hex">#1A2029</span></div>
    <div class="sw light" style="background:var(--steel-800)"><span class="name">800</span><span class="hex">#28303B</span></div>
    <div class="sw light" style="background:var(--steel-700)"><span class="name">700</span><span class="hex">#3C4654</span></div>
    <div class="sw light" style="background:var(--steel-600)"><span class="name">600</span><span class="hex">#515D6B</span></div>
    <div class="sw light" style="background:var(--steel-500)"><span class="name">500</span><span class="hex">#6E7B8C</span></div>
    <div class="sw dark" style="background:var(--steel-400)"><span class="name">400</span><span class="hex">#9AA6B5</span></div>
    <div class="sw dark" style="background:var(--steel-300)"><span class="name">300</span><span class="hex">#C2CBD6</span></div>
    <div class="sw dark" style="background:var(--steel-200)"><span class="name">200</span><span class="hex">#DCE2EA</span></div>
    <div class="sw dark" style="background:var(--steel-100)"><span class="name">100</span><span class="hex">#ECEFF4</span></div>
    <div class="sw dark b" style="background:var(--steel-50)"><span class="name">50</span><span class="hex">#F5F7FA</span></div>
  </div>
</body>
</html>
