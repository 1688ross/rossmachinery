<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Steel Blue" subtitle="Secondary. #2576BC from the logo chevron." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); }
  .row { display: flex; }
  .sw { flex: 1; height: 150px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; box-sizing: border-box; }
  .sw .name { font-weight: 700; font-size: 13px; }
  .sw .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.85; }
  .light { color: #fff; }
  .dark { color: var(--rms-navy); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw light" style="background:var(--rms-blue-700)"><span class="name">blue-700</span><span class="hex">#1D619E</span></div>
    <div class="sw light" style="background:var(--rms-blue)"><span class="name">blue ●</span><span class="hex">#2576BC</span></div>
    <div class="sw light" style="background:var(--rms-blue-400)"><span class="name">blue-400</span><span class="hex">#5B9CD6</span></div>
    <div class="sw dark" style="background:var(--rms-blue-200)"><span class="name">blue-200</span><span class="hex">#B6D3EC</span></div>
    <div class="sw dark" style="background:var(--rms-blue-100)"><span class="name">blue-100</span><span class="hex">#DCEBF7</span></div>
  </div>
</body>
</html>
