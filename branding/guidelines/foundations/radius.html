<!-- @dsCard group="Spacing" viewport="700x150" name="Radius" subtitle="Restrained & mechanical — the brand leans square." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); padding: 20px; box-sizing: border-box; display: flex; gap: 22px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 88px; height: 64px; background: var(--rms-navy); border: 2px solid var(--rms-blue); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-body); margin-top: 8px; }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:var(--radius-none)"></div><div class="name">none</div><div class="val">0</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="name">sm</div><div class="val">2px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="name">md ●</div><div class="val">4px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="name">lg</div><div class="val">8px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-pill); width:120px"></div><div class="name">pill</div><div class="val">999 · chips</div></div>
</body>
</html>
