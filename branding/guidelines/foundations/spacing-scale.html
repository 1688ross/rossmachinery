<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing Scale" subtitle="4px base. --space-1 → --space-10." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); padding: 20px 26px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 7px; }
  .lbl { width: 64px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .bar { height: 14px; background: var(--rms-blue); border-radius: 2px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row"><span class="lbl">space-1</span><div class="bar" style="width:var(--space-1)"></div><span class="px">4</span></div>
  <div class="row"><span class="lbl">space-2</span><div class="bar" style="width:var(--space-2)"></div><span class="px">8</span></div>
  <div class="row"><span class="lbl">space-3</span><div class="bar" style="width:var(--space-3)"></div><span class="px">12</span></div>
  <div class="row"><span class="lbl">space-4</span><div class="bar" style="width:var(--space-4)"></div><span class="px">16</span></div>
  <div class="row"><span class="lbl">space-5</span><div class="bar" style="width:var(--space-5)"></div><span class="px">24</span></div>
  <div class="row"><span class="lbl">space-6</span><div class="bar" style="width:var(--space-6)"></div><span class="px">32</span></div>
  <div class="row"><span class="lbl">space-7</span><div class="bar" style="width:var(--space-7)"></div><span class="px">48</span></div>
  <div class="row"><span class="lbl">space-8</span><div class="bar" style="width:var(--space-8)"></div><span class="px">64</span></div>
</body>
</html>
