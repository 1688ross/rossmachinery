<!-- @dsCard group="Type" viewport="700x230" name="Display — Saira Condensed" subtitle="Hero & section heads. Often italic + caps to echo the logo." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); padding: 22px 26px; box-sizing: border-box; color: var(--rms-navy); }
  .d1 { font: var(--type-display-lg); font-style: italic; text-transform: uppercase; letter-spacing: var(--tracking-display); margin: 0; }
  .d2 { font: var(--type-display-sm); margin: 8px 0 0; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 14px; }
</style>
</head>
<body>
  <p class="d1">Precision Engineered</p>
  <p class="d2">Advanced Manufacturing Solutions</p>
  <p class="meta">Saira Condensed · 800 italic uppercase / 700 · tracking -0.01em</p>
</body>
</html>
