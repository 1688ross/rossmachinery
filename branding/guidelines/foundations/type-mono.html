<!-- @dsCard group="Type" viewport="700x180" name="Mono & Eyebrow" subtitle="Specs / part numbers (mono) and uppercase labels." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); padding: 22px 26px; box-sizing: border-box; color: var(--rms-navy); }
  .eyebrow { font: var(--type-eyebrow); text-transform: uppercase; letter-spacing: var(--tracking-eyebrow); color: var(--rms-blue); margin: 0 0 16px; }
  .mono { font: var(--type-mono); color: var(--text-body); margin: 0 0 6px; }
  .mono b { color: var(--rms-navy); }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <p class="eyebrow">Serving Aerospace &amp; Advanced Manufacturing</p>
  <p class="mono"><b>X/Y/Z TRAVEL</b> &nbsp; 1500 × 1300 × 1400 mm</p>
  <p class="mono"><b>SPINDLE</b> &nbsp; 30 / 50 taper · 12,000 rpm</p>
  <p class="mono"><b>PART NO.</b> &nbsp; HPX-150-A5 &nbsp;<span class="cap">IBM Plex Mono · 500</span></p>
</body>
</html>
