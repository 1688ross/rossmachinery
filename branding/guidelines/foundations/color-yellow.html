<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Safety Yellow" subtitle="Accent. #FBB51C from the logo bar. Use sparingly." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); }
  .row { display: flex; }
  .sw { flex: 1; height: 150px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; box-sizing: border-box; color: var(--rms-navy); }
  .sw .name { font-weight: 700; font-size: 13px; }
  .sw .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.85; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--rms-yellow-700)"><span class="name">yellow-700</span><span class="hex">#C6900F</span></div>
    <div class="sw" style="background:var(--rms-yellow-600)"><span class="name">yellow-600</span><span class="hex">#E0A015</span></div>
    <div class="sw" style="background:var(--rms-yellow)"><span class="name">yellow ●</span><span class="hex">#FBB51C</span></div>
    <div class="sw" style="background:var(--rms-yellow-300)"><span class="name">yellow-300</span><span class="hex">#FDD277</span></div>
    <div class="sw" style="background:var(--rms-yellow-100)"><span class="name">yellow-100</span><span class="hex">#FEF0CF</span></div>
  </div>
</body>
</html>
