<!-- @dsCard group="Brand" viewport="700x200" name="The Mark" subtitle="The 'R' mark for favicons, avatars & tight spaces." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); display: flex; align-items: center; justify-content: center; gap: 48px; height: 200px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .tile img { height: 84px; width: auto; }
  .on-navy { background: var(--rms-navy); padding: 22px; border-radius: var(--radius-md); }
  .on-navy img { height: 64px; }
  .cap { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="tile"><img src="../../assets/logos/rms-mark.svg" alt="RMS mark"><span class="cap">mark · color</span></div>
  <div class="tile"><div class="on-navy"><img src="../../assets/logos/rms-mark.svg" alt="RMS mark on navy"></div><span class="cap">mark · on navy</span></div>
</body>
</html>
