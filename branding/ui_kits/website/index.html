<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ross Machinery — Advanced Manufacturing Solutions</title>
<link rel="icon" href="../../assets/logos/rms-mark.svg">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); color: var(--text-body); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="Sections.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    const S = window.RmsSite;
    function App() {
      const [quote, setQuote] = useState(false);
      const open = () => setQuote(true);
      return (
        <div>
          <S.Header onQuote={open} />
          <S.Hero onQuote={open} />
          <S.TrustBar />
          <S.Stats />
          <S.Machines onQuote={open} />
          <S.MediaBand />
          <S.Services />
          <S.CTA onQuote={open} />
          <S.Footer />
          <S.QuoteModal open={quote} onClose={() => setQuote(false)} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
