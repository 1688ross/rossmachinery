{% extends "core/base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<main class="login">
  <div class="login-card">
    <img src="/static/assets/logos/rms-logo-color.png" alt="Ross Machinery Sales" class="login-logo">
    <h1 class="eyebrow">Sign in</h1>
    {% if form.errors %}<p class="form-error">Your username and password did not match.</p>{% endif %}
    <form method="post">{% csrf_token %}
      <label>Username <input name="username" autofocus autocomplete="username"></label>
      <label>Password <input type="password" name="password" autocomplete="current-password"></label>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </div>
</main>
{% endblock %}
